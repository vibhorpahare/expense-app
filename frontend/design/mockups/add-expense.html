<body class="bg-background text-on-background font-body-md min-h-screen selection:bg-primary/30">
<header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-xl border-b border-white/10 h-16 flex justify-between items-center px-container-margin">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary">New Expense</h1>
<button class="text-secondary font-body-md font-semibold hover:opacity-80 transition-opacity active:scale-95 duration-200">
            Save
        </button>
</header>
<main class="pt-24 pb-32 px-container-margin max-w-lg mx-auto">
<section class="flex flex-col items-center mb-12">
<div class="flex items-start gap-1">
<span class="font-display-lg-mobile text-display-lg-mobile text-primary-container opacity-50 mt-2">$</span>
<input class="bg-transparent border-none text-center font-display-lg-mobile text-display-lg-mobile text-on-background w-full focus:ring-0" id="amount-input" readonly="" type="text" value="0.00"/>
</div>
<button class="mt-4 flex items-center gap-2 px-4 py-2 glass-card rounded-full text-secondary hover:bg-white/5 transition-colors group">
<span class="material-symbols-outlined text-[20px]">photo_camera</span>
<span class="font-label-sm text-label-sm">Smart Scan Receipt</span>
</button>
</section>
<section class="space-y-6 mb-8">
<div class="relative">
<input class="w-full bg-surface-container border-none rounded-lg px-4 py-4 text-body-lg font-body-lg text-on-surface placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-primary-container transition-all" placeholder="What was it for?" type="text"/>
</div>
<div class="flex gap-2 overflow-x-auto no-scrollbar pb-2">
<button class="flex-shrink-0 px-4 py-2 rounded-full bg-primary-container text-on-primary-container font-label-sm text-label-sm">
                    Dining
                </button>
<button class="flex-shrink-0 px-4 py-2 rounded-full glass-card text-on-surface-variant font-label-sm text-label-sm hover:text-primary transition-colors">
                    Travel
                </button>
<button class="flex-shrink-0 px-4 py-2 rounded-full glass-card text-on-surface-variant font-label-sm text-label-sm hover:text-primary transition-colors">
                    Grocery
                </button>
<button class="flex-shrink-0 px-4 py-2 rounded-full glass-card text-on-surface-variant font-label-sm text-label-sm hover:text-primary transition-colors">
                    Entertainment
                </button>
<button class="flex-shrink-0 w-10 h-10 flex items-center justify-center rounded-full glass-card text-on-surface-variant">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</section>
<section class="glass-card rounded-lg p-6 space-y-6 relative overflow-hidden">
<div class="absolute -top-12 -right-12 w-32 h-32 bg-primary/10 blur-3xl rounded-full"></div>
<div class="flex justify-between items-center relative">
<h3 class="font-headline-md text-headline-md-mobile text-on-surface">Split with</h3>
<div class="bg-surface-container-highest p-1 rounded-full flex gap-1">
<button class="px-4 py-1.5 rounded-full text-label-sm font-label-sm bg-primary-container text-on-primary-container transition-all" id="btn-equal">Equal</button>
<button class="px-4 py-1.5 rounded-full text-label-sm font-label-sm text-on-surface-variant hover:text-on-surface transition-all" id="btn-percent">Manual</button>
</div>
</div>
<div class="grid grid-cols-4 gap-4 relative">
<div class="flex flex-col items-center gap-2">
<div class="relative">
<img class="w-14 h-14 rounded-full border-2 border-primary object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBwa4JMWDbHGYpsw6uIvmz-Rbvj1taxXtQL2Ri0Tz5KrL5rD0nmiM2kEc-iyP-7Ng3997yYnjMpqxI_67y3up1D-pzxbuxTuYG4FawW6PpfBvXctQ5AY5kOscPGLrysxhDViTU_wn72Pdme3lOvAnuOaPqdxrJEAVvpXA3A14l9KYdivPIBzalqNPb9S28PAVG9QWrgLXa41wCItF38oFWmTXqfCVklOrkfmZs8ijf_pTGpFxDAz5bz2g"/>
<div class="absolute -bottom-1 -right-1 w-5 h-5 bg-secondary rounded-full border-2 border-surface flex items-center justify-center">
<span class="material-symbols-outlined text-[12px] text-on-secondary font-bold">check</span>
</div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">You</span>
</div>
<div class="flex flex-col items-center gap-2 group cursor-pointer">
<div class="w-14 h-14 rounded-full border-2 border-transparent group-hover:border-primary/50 transition-all overflow-hidden bg-surface-container-highest">
<img class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBAVtVqN1j2bCwGPE4qwxynksLFrxWCjVh7gA_kptBhNiXBO0ejrovxdxwsgdCRKZ5Ykib64KN6swi2j1TQXH7DKO_GxIn0mqQo9g1RnJrpJ4aHGq4V5XVCEB6FxFsT3Hqyd7Z6V6fWZBvnAH1Iq5RAcBjqZ4eEAIGG3mMQDc09kMxwUkM9HhQq5dRVFvs7F4N7O-HdhTVA7z_fvYawZy81UmaLGJpHkVenBk1yGV_XoO912BcexVXwwA"/>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Leo</span>
</div>
<div class="flex flex-col items-center gap-2 group cursor-pointer">
<div class="w-14 h-14 rounded-full border-2 border-transparent group-hover:border-primary/50 transition-all overflow-hidden bg-surface-container-highest">
<img class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAZPEfnzFW5k7MOrofFwxZwqLk1RsyF6kIr8d0ksPUtsZ5KSV_gFL8phxp5xmRGpRupWQIgOht0WO3zdY70UbR2NyTZmNLeWPTAH0Lciv7rVTKe0BnRt6BdwV9Jrof5fRl95wy1Olt6y_9NhKQSQ9wFUOxmnfrlKfa1SzvsyNld0HEOQ0B0UPEkgrcBc3AlbE-DLZT4J9rpY1OeAyTTZ7qoexsctg_5KzW3ovx-Hn2oF9hdDiOD5WbXSw"/>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Maya</span>
</div>
<button class="flex flex-col items-center gap-2 group">
<div class="w-14 h-14 rounded-full border-2 border-dashed border-outline-variant flex items-center justify-center text-outline-variant group-hover:border-primary group-hover:text-primary transition-all">
<span class="material-symbols-outlined">person_add</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Add</span>
</button>
</div>
</section>
<section class="fixed bottom-0 left-0 w-full bg-surface-container-low/95 backdrop-blur-2xl rounded-t-[2.5rem] p-8 border-t border-white/5">
<div class="max-w-md mx-auto grid grid-cols-3 gap-y-4 gap-x-8">
<button class="keypad-button h-16 rounded-2xl flex items-center justify-center text-headline-md font-headline-md text-on-surface" onclick="updateAmount('1')">1</button>
<button class="keypad-button h-16 rounded-2xl flex items-center justify-center text-headline-md font-headline-md text-on-surface" onclick="updateAmount('2')">2</button>
<button class="keypad-button h-16 rounded-2xl flex items-center justify-center text-headline-md font-headline-md text-on-surface" onclick="updateAmount('3')">3</button>
<button class="keypad-button h-16 rounded-2xl flex items-center justify-center text-headline-md font-headline-md text-on-surface" onclick="updateAmount('4')">4</button>
<button class="keypad-button h-16 rounded-2xl flex items-center justify-center text-headline-md font-headline-md text-on-surface" onclick="updateAmount('5')">5</button>
<button class="keypad-button h-16 rounded-2xl flex items-center justify-center text-headline-md font-headline-md text-on-surface" onclick="updateAmount('6')">6</button>
<button class="keypad-button h-16 rounded-2xl flex items-center justify-center text-headline-md font-headline-md text-on-surface" onclick="updateAmount('7')">7</button>
<button class="keypad-button h-16 rounded-2xl flex items-center justify-center text-headline-md font-headline-md text-on-surface" onclick="updateAmount('8')">8</button>
<button class="keypad-button h-16 rounded-2xl flex items-center justify-center text-headline-md font-headline-md text-on-surface" onclick="updateAmount('9')">9</button>
<button class="keypad-button h-16 rounded-2xl flex items-center justify-center text-headline-md font-headline-md text-on-surface" onclick="updateAmount('.')">.</button>
<button class="keypad-button h-16 rounded-2xl flex items-center justify-center text-headline-md font-headline-md text-on-surface" onclick="updateAmount('0')">0</button>
<button class="keypad-button h-16 rounded-2xl flex items-center justify-center text-headline-md font-headline-md text-on-surface" onclick="updateAmount('delete')">
<span class="material-symbols-outlined">backspace</span>
</button>
</div>
<div class="mt-8 flex justify-center">
<button class="w-full bg-primary text-on-primary font-headline-md py-4 rounded-full shadow-[0_0_20px_rgba(192,193,255,0.3)] active:scale-95 transition-transform">
                    Confirm $0.00
                </button>
</div>
</section>
</main>
<script>
        let currentAmount = "0.00";
        const amountDisplay = document.getElementById('amount-input');
        const confirmBtn = document.querySelector('button.bg-primary');

        function updateAmount(val) {
            if (val === 'delete') {
                currentAmount = currentAmount.slice(0, -1);
                if (currentAmount === "") currentAmount = "0";
            } else if (val === '.') {
                if (!currentAmount.includes('.')) {
                    currentAmount += '.';
                }
            } else {
                if (currentAmount === "0.00" || currentAmount === "0") {
                    currentAmount = val;
                } else {
                    currentAmount += val;
                }
            }
            amountDisplay.value = currentAmount;
            confirmBtn.innerText = `Confirm $${currentAmount}`;
        }

        const btnEqual = document.getElementById('btn-equal');
        const btnPercent = document.getElementById('btn-percent');

        btnEqual.addEventListener('click', () => {
            btnEqual.className = "px-4 py-1.5 rounded-full text-label-sm font-label-sm bg-primary-container text-on-primary-container transition-all";
            btnPercent.className = "px-4 py-1.5 rounded-full text-label-sm font-label-sm text-on-surface-variant hover:text-on-surface transition-all";
        });

        btnPercent.addEventListener('click', () => {
            btnPercent.className = "px-4 py-1.5 rounded-full text-label-sm font-label-sm bg-primary-container text-on-primary-container transition-all";
            btnEqual.className = "px-4 py-1.5 rounded-full text-label-sm font-label-sm text-on-surface-variant hover:text-on-surface transition-all";
        });
    </script>
